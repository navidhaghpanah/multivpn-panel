<!doctype html>
<html lang="{{ lang }}" dir="ltr" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.login_title }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261008-ui') }}">
</head>
<body class="login-body" data-lang="{{ lang }}">
  <div class="login-toolbar">
    <form method="post" action="{{ url_for('settings_theme') }}" class="icon-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="theme" value="{{ 'light' if theme == 'dark' else 'dark' }}">
      <button class="ghost-button" type="submit">{% if theme == 'dark' %}☀{% else %}☾{% endif %}</button>
    </form>
    <div class="lang-switch">
      <form method="post" action="{{ url_for('settings_lang') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="lang" value="fa"><button type="submit" class="{{ 'active' if lang == 'fa' else '' }}">FA</button></form>
      <form method="post" action="{{ url_for('settings_lang') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="lang" value="en"><button type="submit" class="{{ 'active' if lang == 'en' else '' }}">EN</button></form>
    </div>
  </div>
  <form class="login-card" method="post" dir="{{ content_dir }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mark"><img src="{{ url_for('static', filename='logo.png') }}" alt="NH MultiVPN"></div>
    <h1>{{ t.login_h }}</h1>
    <p class="muted">{{ host or t.login_p }}</p>
    {% if err %}<div class="alert bad">{{ err }}</div>{% endif %}
    <label for="login-user">{{ t.login_user }}</label>
    <input id="login-user" name="user" autocomplete="username" autofocus required>
    <label for="login-password">{{ t.login_pass }}</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    {% if totp_on %}
    <label for="login-totp">{{ t.login_totp }}</label>
    <input id="login-totp" name="totp" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" dir="ltr" required>
    {% endif %}
    <button type="submit">{{ t.login_btn }}</button>
    <p class="authors-line">{{ t.authors }}</p>
  </form>
  <script src="{{ url_for('static', filename='copy.js', v='20261008-ui') }}" defer></script>
</body>
</html>
